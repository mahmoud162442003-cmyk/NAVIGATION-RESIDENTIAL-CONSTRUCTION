<style>:root{--blue:#1b3fd8;--black:#0a0c12;--gold:#d4a62a;--silver:#c9ced6;--mist:#eef1f6;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:15px Archivo,Arial,sans-serif;background:var(--mist);color:#161a24;padding-top:env(safe-area-inset-top,0px)}
.top{background:var(--black);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold)}.top b{font-size:17px}.top span{margin-left:auto;font-size:12px;color:var(--silver)}
.top button{background:none;border:1px solid var(--silver);color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
.wrap{max-width:860px;margin:0 auto}.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--silver)}.tabs button{padding:13px 18px;border:0;background:none;font:700 14px Archivo,Arial,sans-serif;cursor:pointer;color:#4b5363;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--blue);border-color:var(--blue)}
.body{background:#fff;padding:20px;min-height:60vh}h4{margin:20px 0 6px;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}label{display:block;font-size:12px;color:#5a6272;margin:9px 0 3px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--silver);border-radius:4px;font:15px Archivo,Arial,sans-serif}textarea{min-height:72px;resize:vertical}
.b{padding:9px 14px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;font:700 13px Archivo,Arial,sans-serif;cursor:pointer}.b.o{background:#fff;color:var(--blue)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--mist)}.th{width:96px;height:58px;background:#16265f center/contain no-repeat;border:1px solid var(--silver);flex:none}.row .i{flex:1;font-weight:600}.row small{display:block;font-weight:400;color:#5a6272}
.card{max-width:400px;margin:8vh auto;background:#fff;padding:30px;border-top:5px solid var(--gold);border-radius:6px}.card img{height:64px;display:block;margin:0 auto 14px}.card h2{text-align:center;margin:0 0 6px}.card p{text-align:center;color:#5a6272;font-size:13px}.card .b{width:100%;margin-top:16px;padding:12px}.msg{color:#b3261e;text-align:center;font-size:13px;margin-top:10px;min-height:16px}
.note{background:#fff8e1;border:1px solid var(--gold);padding:12px;border-radius:4px;font-size:13px;margin:0 0 14px}</style><style>.card{max-width:460px}.card.w{max-width:720px;text-align:left}.card ol{font-size:14px;line-height:1.6;padding-left:20px}.card label{margin-top:12px}</style><style>.lbg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 60% at 50% 0%,#1b3fd8 0%,#0d1a5c 38%,#0a0c12 100%)}
.card{margin:0;width:100%;max-width:460px;border-radius:28px;border:1px solid #d9dde6;border-top:1px solid #d9dde6;padding:34px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45);font-family:'DM Sans',Arial,sans-serif}
.card img{height:64px;margin:0 auto 6px}.ap{display:block;text-align:center;letter-spacing:.28em;font-size:13px;color:#6a7384;margin-bottom:26px}
.card h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;text-align:left;margin:0 0 6px;font-weight:600;line-height:1.05}
.card p{text-align:left;font-size:17px;color:#6a7384;margin:0 0 22px}.card.w p{font-size:15px}
.card label{font-size:15px;font-weight:600;color:#0a0c12;margin:16px 0 8px}
.card input{padding:17px 18px;border-radius:16px;border:1.5px solid #d9dde6;font-size:16px;font-family:'DM Sans',Arial,sans-serif}
.pwf{position:relative}.pwf input{padding-right:72px}.shw{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6a7384;font:500 15px 'DM Sans',Arial,sans-serif;cursor:pointer}
.card .b{border-radius:999px;padding:18px;font-size:17px;margin-top:30px;border:0;background:#1b3fd8}
.card.w{max-width:560px}.bk{display:block;text-align:center;margin-top:20px;color:#6a7384;font-size:16px;text-decoration:none}
@media(max-width:480px){.card h2{font-size:38px}}</style><style>.top .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a0c12;color:#fff;border:2px solid #d4a62a;padding:10px 18px;border-radius:999px;z-index:60;font-size:13px;max-width:90vw;text-align:center;margin:0}.top .toast:empty{display:none}</style><style>.mqroot .mq{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.mqroot .mqt{writing-mode:vertical-rl;text-orientation:mixed;display:flex;flex-direction:row;height:max-content;flex:none;white-space:nowrap;direction:ltr;font-family:var(--mq-fam,inherit);font-weight:var(--mq-fw,900);font-size:var(--mq-fs,160px);line-height:1;letter-spacing:var(--mq-ls,3px);color:var(--mq-color,#fff);opacity:var(--mq-op,.23);text-transform:none;animation:mqup var(--mq-dur,30s) linear infinite;will-change:transform}
.mqroot[data-dir=down] .mqt{animation-name:mqdn}
.mqroot[data-rot=stack] .mqt{text-orientation:upright}
.mqroot .mqg{display:flex;flex-direction:row;align-items:center;flex:none}
.mqroot[data-rot=ccw] .mqg{transform:rotate(180deg)}
.mqroot .mqw{flex:none;margin:calc(var(--mq-ws,0px)/2) 0}
.mqroot.nosep .mqw{margin-bottom:calc(var(--mq-ws,0px)/2 + var(--mq-gap,.5)*1em)}
.mqroot .mqs{flex:none;display:block;margin:calc(var(--mq-gap,.5)*1em) 0;background:var(--mq-sepc,currentColor)}
.mqroot .mqs.circle{width:calc(var(--mq-dot,.22)*1em);height:calc(var(--mq-dot,.22)*1em);border-radius:50%}
.mqroot .mqs.diamond{width:calc(var(--mq-dot,.22)*1em);height:calc(var(--mq-dot,.22)*1em);transform:rotate(45deg)}
.mqroot .mqs.dash{width:calc(var(--mq-dot,.22)*.5em);height:calc(var(--mq-dot,.22)*3em)}
.mqroot[data-rot=stack] .mqs.dash{width:calc(var(--mq-dot,.22)*3em);height:calc(var(--mq-dot,.22)*.5em)}
.mqroot .mqs.custom{background:none;color:var(--mq-sepc,currentColor);font-size:calc(var(--mq-dot,.22)*4.5em);line-height:1}
.mqroot.static .mqt{animation:none}
.mqroot.paused .mqt,.mqroot.hp:hover .mqt{animation-play-state:paused}
@keyframes mqup{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,calc(var(--mq-dist,0px)*-1),0)}}
@keyframes mqdn{from{transform:translate3d(0,calc(var(--mq-dist,0px)*-1),0)}to{transform:translate3d(0,0,0)}}
.mqbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;background:#eef1f6;border:1px solid #c9ced6;margin:0 0 16px;position:sticky;top:0;z-index:5}
.mqdirty{font-weight:700;font-size:13px;color:#5a6272}.mqdirty.on{color:#b3261e}.mqmsg{font-size:13px;flex:1 1 100%}.mqmsg.ok{color:#1b6e2d}.mqmsg.err{color:#b3261e}.mqmsg:empty{display:none}
.mqgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}.mqR{position:sticky;top:96px}
.mqpvbox{background:#d7dbe3;padding:16px;border-radius:6px;position:relative}.mqoff{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-weight:700;color:#161a24}
.mqpv{height:460px;display:flex;flex-direction:column;background:var(--mq-bg,#203ED5);margin:0 auto;overflow:hidden}
.pvlogo{padding:12px 0 8px;text-align:center;flex:none}.pvlogo img{height:34px;background:#fff;padding:5px 7px;max-width:calc(100% - 16px);width:auto;object-fit:contain}
.mqrow{display:flex;gap:10px;align-items:center}.mqrow input[type=range]{flex:1;min-width:0}.mqrow input[type=number],.mqrow input[type=text]{width:96px}.mqrow input[type=color]{width:46px;height:40px;padding:2px;flex:none}
.mqun{font-size:12px;color:#5a6272;min-width:34px}.mqchk{display:flex;gap:8px;align-items:center;font-size:14px;color:#161a24;margin:8px 0}.mqwr{display:flex;gap:6px;margin:6px 0}.mqwr input{flex:1}.mqwr .b{padding:6px 10px}
.mqdev{display:flex;gap:8px;margin:6px 0 4px}.mqcap{font-size:12px;color:#5a6272;margin:8px 0}.mqL select{width:100%;padding:10px;border:1px solid #c9ced6;border-radius:4px;font:15px Arial,sans-serif;background:#fff}.mqL input.bad{border-color:#b3261e;background:#fdecea}
@media(max-width:980px){.mqgrid{grid-template-columns:1fr}.mqR{position:static;order:-1}}

<style>.hx{position:relative;overflow:hidden;isolation:isolate;display:flex;background:#101C30;color:#fff;min-height:var(--hx-h,680px)}
.hx .hbg{position:absolute;inset:0;z-index:0;overflow:hidden}
.hx .hbg img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:var(--hx-px,70%) var(--hx-py,50%);transform:scale(var(--hx-zoom,1));transform-origin:var(--hx-px,70%) var(--hx-py,50%)}
.hx .hov{position:absolute;inset:0;z-index:1;background:var(--hx-grad,linear-gradient(to right,rgba(16,28,48,.82) 0%,rgba(16,28,48,.59) 20%,rgba(16,28,48,0) 70%))}
.hx .hw{position:relative;z-index:2;align-self:stretch;width:100%;max-width:1120px;margin:0 auto;padding:64px 24px;display:flex;align-items:var(--hx-va,center);justify-content:var(--hx-ha,flex-start)}
.hx .hc{width:100%;max-width:var(--hx-w,640px);text-align:var(--hx-ta,start)}
.hx h1{margin:0 0 20px;font-family:var(--hx-fam,inherit);font-weight:var(--hx-fw,800);font-size:var(--hx-fs,64px);line-height:var(--hx-lh,1.05);letter-spacing:var(--hx-ls,-.5px);color:var(--hx-c,#fff);text-shadow:0 2px 20px rgba(16,28,48,.35)}
.hx h1 .hl{display:block;white-space:nowrap}.hx[data-dev=mobile] h1 .hl{display:inline;white-space:normal}
.hx mark.hlw{background:transparent;color:var(--hx-hl,#203ED5)}
.hx[data-hl=marker] mark.hlw{background:var(--hx-hl,#203ED5);color:var(--hx-hlt,#fff);padding:var(--hx-hpy,.02em) var(--hx-hpx,.16em);border-radius:var(--hx-hr,.12em);-webkit-box-decoration-break:clone;box-decoration-break:clone;text-shadow:none}
.hx[data-hl=off] mark.hlw{background:none;color:inherit;padding:0}
.hx .hw p{margin:0 0 28px;max-width:56ch;font-size:var(--hx-ds,18px);line-height:1.6;color:var(--hx-dc,#fff);opacity:.92;text-shadow:0 1px 12px rgba(16,28,48,.4)}
.hx[data-ha=center] .hw p{margin-inline:auto}
.hx .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:var(--hx-ha,flex-start)}
.hx .row a.btn{--b-bg:#203ED5;--b-c:#fff;--b-bd:#203ED5;--b-r:6px;display:inline-block;background:var(--b-bg);color:var(--b-c);border:1.5px solid var(--b-bd);border-radius:var(--b-r);padding:14px 28px;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;cursor:pointer;transition:background-color .2s ease,transform .2s ease,box-shadow .2s ease,filter .2s ease}
.hx .row a.btn:nth-child(2){--b-bg:transparent;--b-bd:#fff;border-width:1px}
.hx .row a.btn:first-child:hover{filter:brightness(.88);transform:translateY(-1px);box-shadow:0 8px 22px rgba(32,62,213,.38)}
.hx .row a.btn:nth-child(2):hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.hx .row a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #203ED5}
.hx[data-dev=tablet] .hw{padding:52px 24px}.hx[data-dev=mobile] .hw{padding:44px 20px}.hx[data-dev=mobile] .row a.btn{padding:13px 22px;font-size:15px}
.bar.hxb{background:var(--st-bg,#101C30);color:var(--st-c,#fff);border-top:3px solid var(--st-a,#203ED5)}
.bar.hxb .w{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;padding-top:0;padding-bottom:0}
.bar.hxb .st{display:flex;align-items:center;gap:16px;padding:26px 24px;border-inline-start:1px solid rgba(255,255,255,.12)}
.bar.hxb .st:first-child{border-inline-start:0;padding-inline-start:0}
.bar.hxb .si{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--st-a,#203ED5);background:rgba(32,62,213,.18);background:color-mix(in srgb,var(--st-a,#203ED5) 20%,transparent);display:flex;align-items:center;justify-content:center}
.bar.hxb .si svg{width:24px;height:24px;fill:none;stroke:var(--st-c,#fff);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bar.hxb b{display:block;font-size:30px;font-weight:800;line-height:1.1;color:var(--st-c,#fff)}
.bar.hxb span{display:block;margin-top:4px;font-size:14px;color:var(--st-c,#fff);opacity:.78}
.bar.hxb[data-dev=tablet] .w{grid-template-columns:repeat(2,1fr)}.bar.hxb[data-dev=tablet] .st:nth-child(odd){border-inline-start:0;padding-inline-start:0}
.bar.hxb[data-dev=mobile] .w{grid-template-columns:1fr 1fr}.bar.hxb[data-dev=mobile] .st{padding:18px 8px;gap:10px;border-inline-start:0}.bar.hxb[data-dev=mobile] .si{width:38px;height:38px}.bar.hxb[data-dev=mobile] .si svg{width:19px;height:19px}.bar.hxb[data-dev=mobile] b{font-size:22px}.bar.hxb[data-dev=mobile] span{font-size:12.5px}
.hxtop{position:sticky;top:0;z-index:6;background:#fff;padding-bottom:8px;border-bottom:1px solid #c9ced6}.hxtop .mqbar{position:static;margin:0 0 8px}@media(max-height:780px){.hxtop{position:static}}.hxpv{padding:0}.hxp .row{padding:0;border-bottom:0;align-items:stretch}
.hxv{width:100%;overflow:hidden;background:#d7dbe3;border:1px solid #c9ced6;position:relative}
.hxs{transform-origin:top left;position:absolute;left:0;top:0}
.hxp{font-family:Archivo,Arial,sans-serif;line-height:1.55;color:#fff}.hxp *,.hxp *::before,.hxp *::after{box-sizing:border-box}.hxp a{text-decoration:none;color:inherit}.hxp .w{max-width:1120px;margin:0 auto;padding:0 24px}.hxp h1,.hxp p,.hxp b,.hxp span{font-family:inherit}
.hxp .hx h1{font-family:var(--hx-fam,inherit)}.hxp b{font-size:30px}
.hxp .bar.hxb[data-dev=mobile] b{font-size:22px}

.tvp .tvsec{background:#fff;color:#161a24;padding:34px 0}.tvp .tvsec h2{margin:0 0 14px;font-size:36px}.tvp .svc{border:1px solid #c9ced6;border-top:4px solid #203ED5;padding:20px;max-width:360px}.tvp .svc h3{margin:0 0 6px;font-size:19px}.tvp .svc p{margin:0;font-size:15px;color:#4b5363}
