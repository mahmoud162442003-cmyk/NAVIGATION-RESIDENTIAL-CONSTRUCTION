<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRC Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--blue:#1b3fd8;--black:#0a0c12;--gold:#d4a62a;--silver:#c9ced6;--mist:#eef1f6;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:15px Archivo,Arial,sans-serif;background:var(--mist);color:#161a24;padding-top:env(safe-area-inset-top,0px)}
.top{background:var(--black);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold)}.top b{font-size:17px}.top span{margin-left:auto;font-size:12px;color:var(--silver)}
.top button{background:none;border:1px solid var(--silver);color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
.wrap{max-width:860px;margin:0 auto}.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--silver)}.tabs button{padding:13px 18px;border:0;background:none;font:700 14px Archivo,Arial,sans-serif;cursor:pointer;color:#4b5363;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--blue);border-color:var(--blue)}
.body{background:#fff;padding:20px;min-height:60vh}h4{margin:20px 0 6px;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}label{display:block;font-size:12px;color:#5a6272;margin:9px 0 3px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--silver);border-radius:4px;font:15px Archivo,Arial,sans-serif}textarea{min-height:72px;resize:vertical}
.b{padding:9px 14px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;font:700 13px Archivo,Arial,sans-serif;cursor:pointer}.b.o{background:#fff;color:var(--blue)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--mist)}.th{width:96px;height:58px;background:#16265f center/contain no-repeat;border:1px solid var(--silver);flex:none}.row .i{flex:1;font-weight:600}.row small{display:block;font-weight:400;color:#5a6272}
.card{max-width:400px;margin:8vh auto;background:#fff;padding:30px;border-top:5px solid var(--gold);border-radius:6px}.card img{height:64px;display:block;margin:0 auto 14px}.card h2{text-align:center;margin:0 0 6px}.card p{text-align:center;color:#5a6272;font-size:13px}.card .b{width:100%;margin-top:16px;padding:12px}.msg{color:#b3261e;text-align:center;font-size:13px;margin-top:10px;min-height:16px}
.note{background:#fff8e1;border:1px solid var(--gold);padding:12px;border-radius:4px;font-size:13px;margin:0 0 14px}</style><style>.card{max-width:460px}.card.w{max-width:720px;text-align:left}.card ol{font-size:14px;line-height:1.6;padding-left:20px}.card label{margin-top:12px}</style><style>.lbg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 60% at 50% 0%,#1b3fd8 0%,#0d1a5c 38%,#0a0c12 100%)}
.card{margin:0;width:100%;max-width:460px;border-radius:28px;border:1px solid #d9dde6;border-top:1px solid #d9dde6;padding:34px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45);font-family:'DM Sans',Arial,sans-serif}
.card img{height:64px;margin:0 auto 6px}.ap{display:block;text-align:center;letter-spacing:.28em;font-size:13px;color:#6a7384;margin-bottom:26px}
.card h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;text-align:left;margin:0 0 6px;font-weight:600;line-height:1.05}
.card p{text-align:left;font-size:17px;color:#6a7384;margin:0 0 22px}.card.w p{font-size:15px}
.card label{font-size:15px;font-weight:600;color:#0a0c12;margin:16px 0 8px}
.card input{padding:17px 18px;border-radius:16px;border:1.5px solid #d9dde6;font-size:16px;font-family:'DM Sans',Arial,sans-serif}
.pwf{position:relative}.pwf input{padding-right:72px}.shw{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6a7384;font:500 15px 'DM Sans',Arial,sans-serif;cursor:pointer}
.card .b{border-radius:999px;padding:18px;font-size:17px;margin-top:30px;border:0;background:#1b3fd8}
.card.w{max-width:560px}.bk{display:block;text-align:center;margin-top:20px;color:#6a7384;font-size:16px;text-decoration:none}
@media(max-width:480px){.card h2{font-size:38px}}</style></head><body><div id="app"></div>
